name: Build Flood Prediction ML Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build professional project
        shell: bash
        run: |
          set -e

          mkdir -p assets
          mkdir -p data
          mkdir -p models
          mkdir -p notebooks
          mkdir -p outputs
          mkdir -p src
          mkdir -p tests

          # ---------------------------------------------------------
          # Move original notebook
          # ---------------------------------------------------------

          if [ -f "regression-flood-prediction-lgmb.ipynb" ]; then
            mv "regression-flood-prediction-lgmb.ipynb" \
               "notebooks/flood_prediction_lightgbm.ipynb"
          fi

          # ---------------------------------------------------------
          # src/__init__.py
          # ---------------------------------------------------------

          cat > src/__init__.py <<'PYEOF'
          """
          Flood Prediction with LightGBM.

          Reusable regression pipeline for structured flood-related data.
          """

          __version__ = "1.0.0"
          PYEOF

          # ---------------------------------------------------------
          # src/config.py
          # ---------------------------------------------------------

          cat > src/config.py <<'PYEOF'
          from pathlib import Path

          ROOT_DIR = Path(__file__).resolve().parent.parent

          DATA_DIR = ROOT_DIR / "data"
          MODEL_DIR = ROOT_DIR / "models"
          OUTPUT_DIR = ROOT_DIR / "outputs"

          DEFAULT_TARGET = "FloodProbability"
          DEFAULT_ID_COLUMN = "id"

          RANDOM_SEED = 42
          TEST_SIZE = 0.20

          MODEL_FILENAME = "lightgbm_flood_pipeline.joblib"
          PYEOF

          # ---------------------------------------------------------
          # src/data.py
          # ---------------------------------------------------------

          cat > src/data.py <<'PYEOF'
          """
          Dataset loading and validation.
          """

          from pathlib import Path

          import pandas as pd
          from sklearn.model_selection import train_test_split

          from .config import RANDOM_SEED, TEST_SIZE


          def load_csv(path):
              path = Path(path)

              if not path.exists():
                  raise FileNotFoundError(
                      f"Dataset not found: {path}"
                  )

              dataframe = pd.read_csv(path)

              if dataframe.empty:
                  raise ValueError(
                      f"Dataset is empty: {path}"
                  )

              return dataframe


          def prepare_training_data(
              dataframe,
              target_column,
              id_column="id",
              test_size=TEST_SIZE,
              random_seed=RANDOM_SEED,
          ):
              if target_column not in dataframe.columns:
                  raise ValueError(
                      f"Target column '{target_column}' "
                      "was not found in the dataset."
                  )

              y = dataframe[target_column].copy()

              drop_columns = [target_column]

              if (
                  id_column
                  and id_column in dataframe.columns
              ):
                  drop_columns.append(id_column)

              X = dataframe.drop(
                  columns=drop_columns
              ).copy()

              if X.empty:
                  raise ValueError(
                      "No feature columns remain after "
                      "removing the target and ID."
                  )

              return train_test_split(
                  X,
                  y,
                  test_size=test_size,
                  random_state=random_seed,
              )


          def prepare_inference_data(
              dataframe,
              id_column="id",
          ):
              ids = None

              if (
                  id_column
                  and id_column in dataframe.columns
              ):
                  ids = dataframe[
                      id_column
                  ].copy()

                  dataframe = dataframe.drop(
                      columns=[id_column]
                  )

              return dataframe, ids
          PYEOF

          # ---------------------------------------------------------
          # src/model.py
          # ---------------------------------------------------------

          cat > src/model.py <<'PYEOF'
          """
          LightGBM regression pipeline.
          """

          import lightgbm as lgb

          from sklearn.compose import ColumnTransformer
          from sklearn.impute import SimpleImputer
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import OrdinalEncoder

          from .config import RANDOM_SEED


          def build_pipeline(
              X,
              n_estimators=700,
              learning_rate=0.05,
              num_leaves=31,
              max_depth=-1,
              subsample=0.90,
              colsample_bytree=0.90,
          ):
              numeric_columns = (
                  X.select_dtypes(
                      include=["number", "bool"]
                  )
                  .columns
                  .tolist()
              )

              categorical_columns = [
                  column
                  for column in X.columns
                  if column not in numeric_columns
              ]

              numeric_pipeline = Pipeline(
                  steps=[
                      (
                          "imputer",
                          SimpleImputer(
                              strategy="median"
                          ),
                      ),
                  ]
              )

              categorical_pipeline = Pipeline(
                  steps=[
                      (
                          "imputer",
                          SimpleImputer(
                              strategy="most_frequent"
                          ),
                      ),
                      (
                          "encoder",
                          OrdinalEncoder(
                              handle_unknown="use_encoded_value",
                              unknown_value=-1,
                          ),
                      ),
                  ]
              )

              preprocessor = ColumnTransformer(
                  transformers=[
                      (
                          "numeric",
                          numeric_pipeline,
                          numeric_columns,
                      ),
                      (
                          "categorical",
                          categorical_pipeline,
                          categorical_columns,
                      ),
                  ],
                  remainder="drop",
                  verbose_feature_names_out=False,
              )

              model = lgb.LGBMRegressor(
                  objective="regression",
                  n_estimators=n_estimators,
                  learning_rate=learning_rate,
                  num_leaves=num_leaves,
                  max_depth=max_depth,
                  subsample=subsample,
                  colsample_bytree=colsample_bytree,
                  random_state=RANDOM_SEED,
                  n_jobs=-1,
                  verbosity=-1,
              )

              return Pipeline(
                  steps=[
                      (
                          "preprocessor",
                          preprocessor,
                      ),
                      (
                          "model",
                          model,
                      ),
                  ]
              )
          PYEOF

          # ---------------------------------------------------------
          # src/utils.py
          # ---------------------------------------------------------

          cat > src/utils.py <<'PYEOF'
          """
          Shared project utilities.
          """

          import json
          import random
          from pathlib import Path

          import numpy as np


          def set_seed(seed=42):
              random.seed(seed)
              np.random.seed(seed)


          def save_json(data, path):
              path = Path(path)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              with path.open(
                  "w",
                  encoding="utf-8",
              ) as file:
                  json.dump(
                      data,
                      file,
                      indent=2,
                  )


          def safe_mape(
              y_true,
              y_pred,
              epsilon=1e-8,
          ):
              y_true = np.asarray(
                  y_true,
                  dtype=float,
              )

              y_pred = np.asarray(
                  y_pred,
                  dtype=float,
              )

              denominator = np.maximum(
                  np.abs(y_true),
                  epsilon,
              )

              return float(
                  np.mean(
                      np.abs(
                          (
                              y_true
                              - y_pred
                          )
                          / denominator
                      )
                  )
                  * 100.0
              )
          PYEOF

          # ---------------------------------------------------------
          # src/evaluate.py
          # ---------------------------------------------------------

          cat > src/evaluate.py <<'PYEOF'
          """
          Regression evaluation utilities.
          """

          import argparse
          from pathlib import Path

          import joblib
          import numpy as np
          import pandas as pd

          from sklearn.metrics import (
              mean_absolute_error,
              mean_squared_error,
              r2_score,
          )

          from .config import (
              DEFAULT_ID_COLUMN,
              DEFAULT_TARGET,
          )

          from .data import load_csv

          from .utils import (
              safe_mape,
              save_json,
          )

          from .visualize import (
              plot_actual_vs_predicted,
              plot_residuals,
          )


          def regression_metrics(
              y_true,
              y_pred,
          ):
              rmse = np.sqrt(
                  mean_squared_error(
                      y_true,
                      y_pred,
                  )
              )

              return {
                  "mae": float(
                      mean_absolute_error(
                          y_true,
                          y_pred,
                      )
                  ),
                  "rmse": float(rmse),
                  "r2": float(
                      r2_score(
                          y_true,
                          y_pred,
                      )
                  ),
                  "mape_percent": safe_mape(
                      y_true,
                      y_pred,
                  ),
              }


          def parse_args():
              parser = argparse.ArgumentParser(
                  description=(
                      "Evaluate a trained "
                      "LightGBM flood pipeline"
                  )
              )

              parser.add_argument(
                  "--model",
                  required=True,
              )

              parser.add_argument(
                  "--data",
                  required=True,
              )

              parser.add_argument(
                  "--target",
                  default=DEFAULT_TARGET,
              )

              parser.add_argument(
                  "--id-column",
                  default=DEFAULT_ID_COLUMN,
              )

              parser.add_argument(
                  "--output-dir",
                  default="outputs/evaluation",
              )

              return parser.parse_args()


          def main():
              args = parse_args()

              dataframe = load_csv(
                  args.data
              )

              if (
                  args.target
                  not in dataframe.columns
              ):
                  raise ValueError(
                      f"Target '{args.target}' "
                      "not found."
                  )

              y_true = dataframe[
                  args.target
              ]

              drop_columns = [
                  args.target
              ]

              if (
                  args.id_column
                  in dataframe.columns
              ):
                  drop_columns.append(
                      args.id_column
                  )

              X = dataframe.drop(
                  columns=drop_columns
              )

              pipeline = joblib.load(
                  args.model
              )

              y_pred = pipeline.predict(
                  X
              )

              metrics = regression_metrics(
                  y_true,
                  y_pred,
              )

              output_dir = Path(
                  args.output_dir
              )

              output_dir.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              save_json(
                  metrics,
                  output_dir
                  / "metrics.json",
              )

              predictions = pd.DataFrame(
                  {
                      "actual": y_true,
                      "predicted": y_pred,
                      "residual": (
                          np.asarray(
                              y_true
                          )
                          - y_pred
                      ),
                  }
              )

              predictions.to_csv(
                  output_dir
                  / "predictions.csv",
                  index=False,
              )

              plot_actual_vs_predicted(
                  y_true,
                  y_pred,
                  output_dir
                  / "actual_vs_predicted.png",
              )

              plot_residuals(
                  y_true,
                  y_pred,
                  output_dir
                  / "residuals.png",
              )

              print(metrics)


          if __name__ == "__main__":
              main()
          PYEOF

          # ---------------------------------------------------------
          # src/visualize.py
          # ---------------------------------------------------------

          cat > src/visualize.py <<'PYEOF'
          """
          Visualization utilities.
          """

          from pathlib import Path

          import matplotlib.pyplot as plt
          import numpy as np
          import pandas as pd


          def _prepare_path(path):
              path = Path(path)

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              return path


          def plot_actual_vs_predicted(
              y_true,
              y_pred,
              path,
          ):
              path = _prepare_path(
                  path
              )

              y_true = np.asarray(
                  y_true
              )

              y_pred = np.asarray(
                  y_pred
              )

              minimum = min(
                  y_true.min(),
                  y_pred.min(),
              )

              maximum = max(
                  y_true.max(),
                  y_pred.max(),
              )

              plt.figure(
                  figsize=(7, 6)
              )

              plt.scatter(
                  y_true,
                  y_pred,
                  alpha=0.55,
              )

              plt.plot(
                  [minimum, maximum],
                  [minimum, maximum],
                  linestyle="--",
              )

              plt.xlabel(
                  "Actual"
              )

              plt.ylabel(
                  "Predicted"
              )

              plt.title(
                  "Actual vs Predicted"
              )

              plt.tight_layout()

              plt.savefig(
                  path,
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close()


          def plot_residuals(
              y_true,
              y_pred,
              path,
          ):
              path = _prepare_path(
                  path
              )

              residuals = (
                  np.asarray(y_true)
                  - np.asarray(y_pred)
              )

              plt.figure(
                  figsize=(7, 5)
              )

              plt.scatter(
                  y_pred,
                  residuals,
                  alpha=0.55,
              )

              plt.axhline(
                  0,
                  linestyle="--",
              )

              plt.xlabel(
                  "Predicted"
              )

              plt.ylabel(
                  "Residual"
              )

              plt.title(
                  "Residual Analysis"
              )

              plt.tight_layout()

              plt.savefig(
                  path,
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close()


          def plot_target_distribution(
              y,
              path,
          ):
              path = _prepare_path(
                  path
              )

              plt.figure(
                  figsize=(7, 5)
              )

              plt.hist(
                  y,
                  bins=30,
                  edgecolor="black",
              )

              plt.xlabel(
                  "Target"
              )

              plt.ylabel(
                  "Frequency"
              )

              plt.title(
                  "Target Distribution"
              )

              plt.tight_layout()

              plt.savefig(
                  path,
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close()


          def save_feature_importance(
              pipeline,
              path_csv,
              path_plot,
          ):
              preprocessor = pipeline.named_steps[
                  "preprocessor"
              ]

              model = pipeline.named_steps[
                  "model"
              ]

              feature_names = (
                  preprocessor
                  .get_feature_names_out()
              )

              importance = model.feature_importances_

              frame = pd.DataFrame(
                  {
                      "feature": feature_names,
                      "importance": importance,
                  }
              ).sort_values(
                  "importance",
                  ascending=False,
              )

              path_csv = _prepare_path(
                  path_csv
              )

              frame.to_csv(
                  path_csv,
                  index=False,
              )

              plot_frame = frame.head(
                  20
              ).sort_values(
                  "importance"
              )

              path_plot = _prepare_path(
                  path_plot
              )

              plt.figure(
                  figsize=(9, 7)
              )

              plt.barh(
                  plot_frame["feature"],
                  plot_frame["importance"],
              )

              plt.xlabel(
                  "Importance"
              )

              plt.title(
                  "LightGBM Feature Importance"
              )

              plt.tight_layout()

              plt.savefig(
                  path_plot,
                  dpi=300,
                  bbox_inches="tight",
              )

              plt.close()

              return frame
          PYEOF

          # ---------------------------------------------------------
          # src/train.py
          # ---------------------------------------------------------

          cat > src/train.py <<'PYEOF'
          """
          Train the LightGBM flood-regression pipeline.
          """

          import argparse
          from pathlib import Path

          import joblib
          import pandas as pd

          from .config import (
              DEFAULT_ID_COLUMN,
              DEFAULT_TARGET,
              MODEL_DIR,
              MODEL_FILENAME,
              OUTPUT_DIR,
              RANDOM_SEED,
          )

          from .data import (
              load_csv,
              prepare_training_data,
          )

          from .evaluate import regression_metrics
          from .model import build_pipeline

          from .utils import (
              save_json,
              set_seed,
          )

          from .visualize import (
              plot_actual_vs_predicted,
              plot_residuals,
              plot_target_distribution,
              save_feature_importance,
          )


          def parse_args():
              parser = argparse.ArgumentParser(
                  description=(
                      "Train LightGBM "
                      "for flood regression"
                  )
              )

              parser.add_argument(
                  "--data",
                  required=True,
              )

              parser.add_argument(
                  "--target",
                  default=DEFAULT_TARGET,
              )

              parser.add_argument(
                  "--id-column",
                  default=DEFAULT_ID_COLUMN,
              )

              parser.add_argument(
                  "--test-size",
                  type=float,
                  default=0.20,
              )

              parser.add_argument(
                  "--estimators",
                  type=int,
                  default=700,
              )

              parser.add_argument(
                  "--learning-rate",
                  type=float,
                  default=0.05,
              )

              parser.add_argument(
                  "--num-leaves",
                  type=int,
                  default=31,
              )

              parser.add_argument(
                  "--max-depth",
                  type=int,
                  default=-1,
              )

              return parser.parse_args()


          def main():
              args = parse_args()

              set_seed(
                  RANDOM_SEED
              )

              dataframe = load_csv(
                  args.data
              )

              X_train, X_valid, \
              y_train, y_valid = (
                  prepare_training_data(
                      dataframe,
                      target_column=args.target,
                      id_column=args.id_column,
                      test_size=args.test_size,
                  )
              )

              pipeline = build_pipeline(
                  X_train,
                  n_estimators=(
                      args.estimators
                  ),
                  learning_rate=(
                      args.learning_rate
                  ),
                  num_leaves=(
                      args.num_leaves
                  ),
                  max_depth=(
                      args.max_depth
                  ),
              )

              pipeline.fit(
                  X_train,
                  y_train,
              )

              predictions = pipeline.predict(
                  X_valid
              )

              metrics = regression_metrics(
                  y_valid,
                  predictions,
              )

              MODEL_DIR.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              OUTPUT_DIR.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              model_path = (
                  MODEL_DIR
                  / MODEL_FILENAME
              )

              joblib.dump(
                  pipeline,
                  model_path,
              )

              save_json(
                  metrics,
                  OUTPUT_DIR
                  / "metrics.json",
              )

              validation_frame = pd.DataFrame(
                  {
                      "actual": (
                          y_valid
                          .reset_index(
                              drop=True
                          )
                      ),
                      "predicted": predictions,
                  }
              )

              validation_frame[
                  "residual"
              ] = (
                  validation_frame[
                      "actual"
                  ]
                  - validation_frame[
                      "predicted"
                  ]
              )

              validation_frame.to_csv(
                  OUTPUT_DIR
                  / "validation_predictions.csv",
                  index=False,
              )

              plot_actual_vs_predicted(
                  y_valid,
                  predictions,
                  OUTPUT_DIR
                  / "actual_vs_predicted.png",
              )

              plot_residuals(
                  y_valid,
                  predictions,
                  OUTPUT_DIR
                  / "residuals.png",
              )

              plot_target_distribution(
                  dataframe[
                      args.target
                  ],
                  OUTPUT_DIR
                  / "target_distribution.png",
              )

              save_feature_importance(
                  pipeline,
                  OUTPUT_DIR
                  / "feature_importance.csv",
                  OUTPUT_DIR
                  / "feature_importance.png",
              )

              print(
                  "\nTraining complete"
              )

              print(
                  f"Model: {model_path}"
              )

              for key, value in (
                  metrics.items()
              ):
                  print(
                      f"{key}: "
                      f"{value:.6f}"
                  )


          if __name__ == "__main__":
              main()
          PYEOF

          # ---------------------------------------------------------
          # src/predict.py
          # ---------------------------------------------------------

          cat > src/predict.py <<'PYEOF'
          """
          Apply a trained flood-regression pipeline
          to unseen CSV data.
          """

          import argparse
          from pathlib import Path

          import joblib
          import pandas as pd

          from .config import DEFAULT_ID_COLUMN

          from .data import (
              load_csv,
              prepare_inference_data,
          )


          def parse_args():
              parser = argparse.ArgumentParser()

              parser.add_argument(
                  "--model",
                  required=True,
              )

              parser.add_argument(
                  "--input",
                  required=True,
              )

              parser.add_argument(
                  "--output",
                  default=(
                      "outputs/"
                      "test_predictions.csv"
                  ),
              )

              parser.add_argument(
                  "--id-column",
                  default=DEFAULT_ID_COLUMN,
              )

              parser.add_argument(
                  "--prediction-column",
                  default="prediction",
              )

              return parser.parse_args()


          def main():
              args = parse_args()

              dataframe = load_csv(
                  args.input
              )

              features, ids = (
                  prepare_inference_data(
                      dataframe,
                      args.id_column,
                  )
              )

              pipeline = joblib.load(
                  args.model
              )

              predictions = pipeline.predict(
                  features
              )

              output = pd.DataFrame()

              if ids is not None:
                  output[
                      args.id_column
                  ] = ids.values

              output[
                  args.prediction_column
              ] = predictions

              output_path = Path(
                  args.output
              )

              output_path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              output.to_csv(
                  output_path,
                  index=False,
              )

              print(
                  f"Predictions saved to "
                  f"{output_path}"
              )


          if __name__ == "__main__":
              main()
          PYEOF

          # ---------------------------------------------------------
          # tests/test_pipeline.py
          # ---------------------------------------------------------

          cat > tests/test_pipeline.py <<'PYEOF'
          import numpy as np
          import pandas as pd

          from src.data import (
              prepare_training_data,
          )

          from src.model import build_pipeline
          from src.utils import safe_mape


          def test_safe_mape_is_finite():
              y_true = np.array(
                  [0.0, 1.0, 2.0]
              )

              y_pred = np.array(
                  [0.1, 1.1, 1.9]
              )

              value = safe_mape(
                  y_true,
                  y_pred,
              )

              assert np.isfinite(value)


          def test_training_pipeline():
              dataframe = pd.DataFrame(
                  {
                      "id": range(20),
                      "rainfall": np.linspace(
                          10,
                          100,
                          20,
                      ),
                      "soil": [
                          "dry",
                          "wet",
                      ] * 10,
                      "FloodProbability":
                          np.linspace(
                              0.1,
                              0.9,
                              20,
                          ),
                  }
              )

              X_train, X_valid, \
              y_train, y_valid = (
                  prepare_training_data(
                      dataframe,
                      target_column=(
                          "FloodProbability"
                      ),
                      id_column="id",
                      test_size=0.25,
                  )
              )

              pipeline = build_pipeline(
                  X_train,
                  n_estimators=10,
              )

              pipeline.fit(
                  X_train,
                  y_train,
              )

              prediction = pipeline.predict(
                  X_valid
              )

              assert len(prediction) == len(
                  y_valid
              )
          PYEOF

          # ---------------------------------------------------------
          # requirements.txt
          # ---------------------------------------------------------

          cat > requirements.txt <<'EOF'
          lightgbm>=4.0
          pandas>=2.0
          numpy>=1.24
          scikit-learn>=1.3
          matplotlib>=3.7
          joblib>=1.3
          jupyter>=1.0
          pytest>=8.0
          EOF

          # ---------------------------------------------------------
          # pyproject.toml
          # ---------------------------------------------------------

          cat > pyproject.toml <<'EOF'
          [project]
          name = "flood-prediction-lightgbm"
          version = "1.0.0"
          description = "LightGBM regression pipeline for flood prediction"
          requires-python = ">=3.10"

          [tool.pytest.ini_options]
          pythonpath = ["."]
          testpaths = ["tests"]
          EOF

          # ---------------------------------------------------------
          # .gitignore
          # ---------------------------------------------------------

          cat > .gitignore <<'EOF'
          # Python
          __pycache__/
          *.py[cod]
          *.egg-info/
          build/
          dist/

          # Environments
          .venv/
          venv/
          env/

          # Jupyter
          .ipynb_checkpoints/

          # IDE
          .vscode/
          .idea/

          # Environment secrets
          .env
          .env.*

          # Local datasets
          data/*
          !data/.gitkeep

          # Trained models
          models/*
          !models/.gitkeep

          # Generated outputs
          outputs/*
          !outputs/.gitkeep

          # OS
          .DS_Store
          Thumbs.db
          EOF

          touch data/.gitkeep
          touch models/.gitkeep
          touch outputs/.gitkeep

      - name: Validate generated Python
        run: |
          python -m compileall src tests

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Repository already up to date."
